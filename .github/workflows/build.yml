name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Rotina.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotina-apk
          path: Rotina.apk

      - name: Publish APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Rotina — última versão"
          body: |
            APK mais recente do app Rotina.

            **Para instalar:** baixe o arquivo `Rotina.apk` abaixo no seu celular Android,
            toque nele e confirme a instalação (autorize "instalar apps desconhecidos" se pedido).
          prerelease: false
          files: Rotina.apk
